name: Weekly ML Data Pipeline

on:
  workflow_dispatch:       # Manual trigger for testing

concurrency:
  group: weekly-ml-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Cache pip dependencies (~900MB torch + sentence-transformers)
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-ml-${{ hashFiles('backend/requirements-ml.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-ml-

      # Cache Whisper model (~139MB)
      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/whisper
          key: whisper-base-v1

      # Cache HuggingFace sentence-transformers model (~90MB)
      - name: Cache HF model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2-v1

      # Install ffmpeg for Whisper audio processing
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      # CPU wheels avoid several GB of unused CUDA/Triton packages on hosted runners.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r backend/requirements-ml.txt

      # ====== PIPELINE STEP 1: Expand artist pool ======
      - name: 🎤 Expand artist pool
        id: expand
        working-directory: backend
        env:
          GENIUS_ACCESS_TOKEN: ${{ secrets.GENIUS_ACCESS_TOKEN }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: python -m ml.pipeline_expand_artists
        continue-on-error: true  # Preserve existing data if both lyric sources are unavailable

      # ====== PIPELINE STEP 2: Track trending songs ======
      - name: 📈 Track trending songs
        id: trending
        working-directory: backend
        run: python -m ml.pipeline_trending
        continue-on-error: true

      # ====== PIPELINE STEP 3: Re-compute BERT embeddings ======
      - name: 🧠 Compute lyrics embeddings
        id: embeddings
        working-directory: backend
        env:
          TOKENIZERS_PARALLELISM: 'false'
        run: python -m ml.compute_lyrics_embeddings

      # ====== PIPELINE STEP 4: Whisper sync new songs ======
      - name: 🎙️ Whisper lyrics sync
        id: sync
        working-directory: backend
        run: python -m ml.sync_lyrics_whisper
        timeout-minutes: 40
        continue-on-error: true  # New songs might not have previews

      # ====== PIPELINE STEP 5: Re-compute insights ======
      - name: 📊 Update insights
        working-directory: backend
        run: python -m app.compute_insights

      - name: Report source availability
        if: always()
        env:
          EXPAND_OUTCOME: ${{ steps.expand.outcome }}
          TRENDING_OUTCOME: ${{ steps.trending.outcome }}
          EMBEDDINGS_OUTCOME: ${{ steps.embeddings.outcome }}
          SYNC_OUTCOME: ${{ steps.sync.outcome }}
        run: |
          {
            echo "## Data refresh status"
            echo "- Artist/lyrics expansion: $EXPAND_OUTCOME"
            echo "- iTunes discovery: $TRENDING_OUTCOME"
            echo "- BERT embeddings: $EMBEDDINGS_OUTCOME"
            echo "- Whisper sync: $SYNC_OUTCOME"
            if [ "$EXPAND_OUTCOME" = "failure" ]; then
              echo "Artist expansion was unavailable. Existing corpus retained; see source errors in the expansion step."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$EXPAND_OUTCOME" = "failure" ]; then
            echo "::warning title=Lyrics source unavailable::Artist expansion failed. Existing corpus retained; other refresh steps can continue."
          fi

      # ====== PIPELINE STEP 6: Commit and push ======
      - name: 📦 Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage all ML data files
          git add backend/ml_data/
          git add backend/app/taylor_complete.json || true

          # Only commit if there are changes
          if git diff --cached --quiet; then
            echo "No data changes — skipping commit"
          else
            ARTIST_COUNT=$(python3 -c "import json; d=json.load(open('backend/ml_data/cross_artist_lyrics.json')); print(len(set(s['artist'] for s in d)))" 2>/dev/null || echo "?")
            SONG_COUNT=$(python3 -c "import json; d=json.load(open('backend/ml_data/cross_artist_lyrics.json')); print(len(d))" 2>/dev/null || echo "?")

            git commit -m "📡 Weekly data update: $(date -u +%Y-%m-%d)

          Automated pipeline run:
          - Cross-artist corpus: ${SONG_COUNT} songs from ${ARTIST_COUNT} artists
          - BERT embeddings re-computed
          - Whisper timings updated
          - Trending snapshot captured
          - Insights refreshed"

            # Preserve application commits pushed while the long ML job ran.
            git pull --rebase origin main
            git push origin HEAD:main
            echo "✅ Data committed and pushed"
          fi
